name: CD - GitOps Deploy via Argo CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

jobs:
  deploy-gitops:
    runs-on: ubuntu-latest

    env:
      # GCP CONFIG
      GCP_PROJECT_ID: platform-test-487912
      GKE_CLUSTER: lcnc-cluster-delhi
      GKE_REGION: asia-south2
      NAMESPACE: apps-release
      GCP_WIF_PROVIDER: "projects/208126041268/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
      GCP_WIF_SA: "github-deployer@platform-test-487912.iam.gserviceaccount.com"
      GAR_REGISTRY: "asia-south2-docker.pkg.dev/platform-test-487912/backstract-apps"

      # AWS CONFIG (To pull images from ECR)
      #AWS_REGION: ap-south-1
      #ECR_REGISTRY: 216084506783.dkr.ecr.ap-south-1.amazonaws.com

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # - name: Configure AWS credentials
    #   uses: aws-actions/configure-aws-credentials@v4
    #   with:
    #     role-to-assume: arn:aws:iam::216084506783:role/GitHubActionsDeployRole
    #     aws-region: ${{ env.AWS_REGION }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
        service_account: ${{ env.GCP_WIF_SA }}

    - name: Get GKE Credentials
      uses: google-github-actions/get-gke-credentials@v2
      with:
        cluster_name: ${{ env.GKE_CLUSTER }}
        location: ${{ env.GKE_REGION }}

    # 1. Provision Runtime Secrets & ECR Credentials into GKE
    #- name: Provision Secrets & ECR Credentials in GKE
    - name: Provision Secrets in GKE
      run: |
        kubectl get ns ${{ env.NAMESPACE }} || kubectl create ns ${{ env.NAMESPACE }}

        # ECR_PASS=$(aws ecr get-login-password --region ${{ env.AWS_REGION }})
        # kubectl create secret docker-registry aws-ecr-creds \
        #   --docker-server=${{ env.ECR_REGISTRY }} \
        #   --docker-username=AWS \
        #   --docker-password=$ECR_PASS \
        #   --namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

        echo "${{ secrets.K8S_ENV_FILE }}" > .env
        kubectl create secret generic app-secrets-coll-c766e74b4a974272b188e43d174331e7 \
          --namespace ${{ env.NAMESPACE }} --from-env-file=.env --dry-run=client -o yaml | kubectl apply -f -

    # 2. Sanitize deployment manifest for GKE Autopilot
    - name: Sanitize Manifests for GKE
      env:
        BST_TOKEN: ${{ secrets.BACKSTRACT_AUTH_TOKEN }}
      run: |
        TARGET_FILE="infra/k8s/gke/deployment.yaml"
        
        # Fallback if file only exists in root infra/k8s
        if [ ! -f "$TARGET_FILE" ] && [ -f "infra/k8s/deployment.yaml" ]; then
          mkdir -p infra/k8s/gke
          cp infra/k8s/deployment.yaml "$TARGET_FILE"
        fi

        if [ -f "$TARGET_FILE" ]; then
          # Inject BST Token if placeholder exists
          awk -v token="${BST_TOKEN}" '{gsub(/PLACEHOLDER_BST_TOKEN_REPLACE_AT_RUNTIME/, token)}1' "$TARGET_FILE" > /tmp/clean_deployment.yaml
          
          # Clean up invalid tolerations/affinity blocks cleanly
          sed -i '/tolerations:/,+3d' /tmp/clean_deployment.yaml
          sed -i '/affinity:/,+8d' /tmp/clean_deployment.yaml

          # Remove legacy aws-ecr-creds imagePullSecrets
          sed -i '/imagePullSecrets:/,+2d' /tmp/clean_deployment.yaml

          # Update image path to Google Artifact Registry if still pointing to AWS ECR
          sed -i 's|216084506783.dkr.ecr.ap-south-1.amazonaws.com/backstract_apps|${{ env.GAR_REGISTRY }}|g' /tmp/clean_deployment.yaml
          
          mv /tmp/clean_deployment.yaml "$TARGET_FILE"
        fi

    # 3. Commit clean manifests back to Git for Argo CD
    - name: Commit Sanitized Manifests
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

        git add infra/k8s/gke/deployment.yaml
        if ! git diff-index --quiet HEAD; then
          git commit -m "chore(gitops): sanitize deployment for GKE Autopilot [skip ci]"
          git pull --rebase origin master
          git push origin master
        else
          echo "No manifest changes to commit."
        fi

    # 4. Notify Argo CD to sync immediately (Valid Push Payload)
    - name: Trigger Argo CD Webhook Sync
      run: |
        # Valid GitHub Push Event Payload that Argo CD accepts
        PAYLOAD=$(cat <<EOF
        {
          "ref": "refs/heads/master",
          "repository": {
            "name": "${{ github.event.repository.name }}",
            "html_url": "${{ github.server_url }}/${{ github.repository }}",
            "clone_url": "${{ github.server_url }}/${{ github.repository }}.git"
          },
          "head_commit": {
            "id": "${{ github.sha }}"
          }
        }
        EOF
        )

        curl -X POST -k https://argocd.backstract.io/api/webhook \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -d "$PAYLOAD"
